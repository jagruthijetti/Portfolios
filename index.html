<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jagruthi Jetti | Portfolios Hub</title>
  <style>
    body {
      background: #02030A;
      color: #F4F7FF;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #39C6FF, #9B5CFF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    p { color: #AAB4D0; font-size: 1.1rem; max-width: 500px; margin-bottom: 2rem; }
    .card-container { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 0.9rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #39C6FF, #9B5CFF);
      color: #fff;
      box-shadow: 0 0 20px rgba(57, 198, 255, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #39C6FF;
      border: 1px solid rgba(57, 198, 255, 0.3);
    }
  </style>
</head>
<body>
  <h1>Jagruthi Jetti's Portfolios</h1>
  <p>Select a portfolio application below to launch the experience:</p>
  <div class="card-container">
    <a href="./opening-page/" class="btn btn-secondary">Opening Hub Page</a>
    <a href="./space-portfolio/" class="btn btn-primary">Space Portfolio</a>
  </div>
</body>
</html>
